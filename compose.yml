services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - urls_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  
  url-shortener:
    build:
      context: .
      dockerfile: /backend/shortener_service/Dockerfile
    container_name: url-shortener
    working_dir: /app
    ports:
      - "8002:8002" 
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PYTHONPATH: "/app:/app/src:/app/generated"
      PORT: 8002
    networks:
      - urls_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  snowflake:
    build:
      context: .
      dockerfile: /backend/snowflake_service/Dockerfile
    container_name: snowflake
    working_dir: /app
    ports:
      - "8001:8001" 
      - "50051:50051" 
    env_file:
      - .env
    environment:
      PYTHONPATH: "/app:/app/src:/app/generated"
      PORT: 8001
    networks:
      - urls_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

networks:
  urls_net:
    driver: bridge

volumes:
  pg_data:
    driver: local